<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" font-family="system-ui, -apple-system, sans-serif">
  <rect width="600" height="340" fill="#fafafa" rx="4"/>

  <!-- Start -->
  <rect x="200" y="20" width="200" height="40" rx="20" fill="#111"/>
  <text x="300" y="45" text-anchor="middle" fill="#fff" font-size="12" font-weight="500">Bad answer from RAG</text>

  <!-- Arrow down -->
  <line x1="300" y1="60" x2="300" y2="90" stroke="#666" stroke-width="1.5"/>
  <polygon points="294,88 300,98 306,88" fill="#666"/>

  <!-- Decision diamond -->
  <polygon points="300,100 450,160 300,220 150,160" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="155" text-anchor="middle" fill="#111" font-size="11" font-weight="500">Is the correct answer</text>
  <text x="300" y="170" text-anchor="middle" fill="#111" font-size="11" font-weight="500">in the retrieved chunks?</text>

  <!-- Left arrow (No) -->
  <line x1="150" y1="160" x2="60" y2="160" stroke="#666" stroke-width="1.5"/>
  <polygon points="62,154 52,160 62,166" fill="#666"/>
  <text x="105" y="150" text-anchor="middle" fill="#888" font-size="11">No</text>

  <!-- Right arrow (Yes) -->
  <line x1="450" y1="160" x2="540" y2="160" stroke="#666" stroke-width="1.5"/>
  <polygon points="538,154 548,160 538,166" fill="#666"/>
  <text x="495" y="150" text-anchor="middle" fill="#888" font-size="11">Yes</text>

  <!-- Left box: Retrieval problem -->
  <rect x="10" y="190" width="120" height="36" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="70" y="213" text-anchor="middle" fill="#111" font-size="11" font-weight="600">Retrieval problem</text>

  <!-- Left sub-items -->
  <line x1="70" y1="226" x2="70" y2="245" stroke="#bbb" stroke-width="1"/>
  <text x="70" y="260" text-anchor="middle" fill="#666" font-size="10">Better embeddings</text>
  <text x="70" y="275" text-anchor="middle" fill="#666" font-size="10">Different chunk sizes</text>
  <text x="70" y="290" text-anchor="middle" fill="#666" font-size="10">Improved search</text>
  <text x="70" y="305" text-anchor="middle" fill="#666" font-size="10">Metadata filters</text>

  <!-- Right box: Synthesis problem -->
  <rect x="480" y="190" width="110" height="36" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="535" y="213" text-anchor="middle" fill="#111" font-size="11" font-weight="600">Synthesis problem</text>

  <!-- Right sub-items -->
  <line x1="535" y1="226" x2="535" y2="245" stroke="#bbb" stroke-width="1"/>
  <text x="535" y="260" text-anchor="middle" fill="#666" font-size="10">Better prompt</text>
  <text x="535" y="275" text-anchor="middle" fill="#666" font-size="10">More capable model</text>
  <text x="535" y="290" text-anchor="middle" fill="#666" font-size="10">Fewer noisy chunks</text>
  <text x="535" y="305" text-anchor="middle" fill="#666" font-size="10">Reranking</text>

  <!-- Connecting lines from decision to boxes -->
  <line x1="70" y1="160" x2="70" y2="190" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="535" y1="160" x2="535" y2="190" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
