<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="720" height="340" fill="#fafafa" rx="4"/>

  <!-- Your Orchestration Layer -->
  <rect x="40" y="30" width="640" height="60" rx="6" fill="#111" stroke="none"/>
  <text x="360" y="55" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">Your Orchestration Layer</text>
  <text x="360" y="75" text-anchor="middle" fill="#999" font-size="11">explicit loops, control flow, logging, error handling</text>

  <!-- Arrow down -->
  <line x1="360" y1="90" x2="360" y2="110" stroke="#999" stroke-width="1.5"/>
  <polygon points="354,108 360,118 366,108" fill="#999"/>

  <!-- Phase boxes row -->
  <rect x="40" y="120" width="148" height="80" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="114" y="148" text-anchor="middle" fill="#111" font-size="13" font-weight="600">Ingestion</text>
  <text x="114" y="168" text-anchor="middle" fill="#666" font-size="10">loaders, splitters,</text>
  <text x="114" y="182" text-anchor="middle" fill="#666" font-size="10">normalizers</text>

  <rect x="204" y="120" width="148" height="80" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="278" y="148" text-anchor="middle" fill="#111" font-size="13" font-weight="600">Retrieval</text>
  <text x="278" y="168" text-anchor="middle" fill="#666" font-size="10">vector search,</text>
  <text x="278" y="182" text-anchor="middle" fill="#666" font-size="10">filters, reranking</text>

  <rect x="368" y="120" width="148" height="80" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="442" y="148" text-anchor="middle" fill="#111" font-size="13" font-weight="600">Synthesis</text>
  <text x="442" y="168" text-anchor="middle" fill="#666" font-size="10">model wrappers,</text>
  <text x="442" y="182" text-anchor="middle" fill="#666" font-size="10">prompts, retries</text>

  <rect x="532" y="120" width="148" height="80" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="606" y="148" text-anchor="middle" fill="#111" font-size="13" font-weight="600">Serving</text>
  <text x="606" y="168" text-anchor="middle" fill="#666" font-size="10">REST API,</text>
  <text x="606" y="182" text-anchor="middle" fill="#666" font-size="10">MCP server</text>

  <!-- Arrows between phases -->
  <line x1="188" y1="160" x2="204" y2="160" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="352" y1="160" x2="368" y2="160" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="516" y1="160" x2="532" y2="160" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrow down to primitives -->
  <line x1="360" y1="200" x2="360" y2="220" stroke="#999" stroke-width="1.5"/>
  <polygon points="354,218 360,228 366,218" fill="#999"/>

  <!-- Primitives row -->
  <rect x="40" y="230" width="640" height="80" rx="4" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="6,3"/>

  <text x="114" y="258" text-anchor="middle" fill="#888" font-size="11">LangChain</text>
  <text x="114" y="274" text-anchor="middle" fill="#888" font-size="11">LlamaIndex</text>
  <text x="114" y="290" text-anchor="middle" fill="#888" font-size="11">Haystack</text>

  <text x="278" y="258" text-anchor="middle" fill="#888" font-size="11">pgvector</text>
  <text x="278" y="274" text-anchor="middle" fill="#888" font-size="11">Pinecone</text>
  <text x="278" y="290" text-anchor="middle" fill="#888" font-size="11">Weaviate</text>

  <text x="442" y="258" text-anchor="middle" fill="#888" font-size="11">LangChain</text>
  <text x="442" y="274" text-anchor="middle" fill="#888" font-size="11">model APIs</text>
  <text x="442" y="290" text-anchor="middle" fill="#888" font-size="11">tenacity</text>

  <text x="606" y="258" text-anchor="middle" fill="#888" font-size="11">FastAPI</text>
  <text x="606" y="274" text-anchor="middle" fill="#888" font-size="11">MCP SDK</text>
  <text x="606" y="290" text-anchor="middle" fill="#888" font-size="11">adapters</text>

  <text x="360" y="330" text-anchor="middle" fill="#aaa" font-size="10" font-style="italic">Interchangeable primitives — the frameworks serve you, not the other way around</text>
</svg>
