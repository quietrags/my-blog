  <text x="60" y="222" font-size="10" fill="#666">Example</text>
  <text x="60" y="238" font-size="11" font-weight="500" fill="#111">Organize 50 meeting notes into a brief</text>

  <!-- Claude Code attributes -->
  <text x="380" y="90" font-size="10" fill="#666">Starting point</text>
  <text x="380" y="106" font-size="11" font-weight="500" fill="#111">Repository with code</text>

