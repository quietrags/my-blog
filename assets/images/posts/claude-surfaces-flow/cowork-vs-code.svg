  <text x="520" y="60" text-anchor="middle" font-size="12" font-weight="600" fill="#111">Claude Code</text>

  <!-- Divider -->
  <line x1="360" y1="50" x2="360" y2="245" stroke="#ddd" stroke-width="1"/>

  <!-- Cowork attributes -->
  <text x="60" y="90" font-size="10" fill="#666">Starting point</text>
  <text x="60" y="106" font-size="11" font-weight="500" fill="#111">Files and folders</text>

  <text x="60" y="134" font-size="10" fill="#666">Mental model</text>
  <text x="60" y="150" font-size="11" font-weight="500" fill="#111">Document transformation</text>

  <text x="60" y="178" font-size="10" fill="#666">Assumes</text>
