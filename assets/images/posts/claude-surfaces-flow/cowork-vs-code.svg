  <text x="380" y="150" font-size="11" font-weight="500" fill="#111">Software development</text>

  <text x="380" y="178" font-size="10" fill="#666">Assumes</text>
  <text x="380" y="194" font-size="11" font-weight="500" fill="#111">Git, tests, build systems</text>

  <text x="380" y="222" font-size="10" fill="#666">Example</text>
