<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, sans-serif">
  <rect width="720" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#111">Two pathways into Claude's surfaces</text>

  <!-- === PRIMARY FLOW (top) === -->
  <text x="30" y="68" font-size="11" font-weight="600" fill="#888" letter-spacing="1">STARTS IN YOUR HEAD</text>

  <!-- Chat box -->
  <rect x="30" y="82" width="160" height="68" rx="8" fill="white" stroke="#111" stroke-width="1.5"/>
  <text x="110" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Chat</text>
  <text x="110" y="124" text-anchor="middle" font-size="10" fill="#666">"I have a question"</text>
  <text x="110" y="137" text-anchor="middle" font-size="10" fill="#666">"Let me think through this"</text>

  <!-- Arrow 1 -->
  <line x1="190" y1="116" x2="248" y2="116" stroke="#111" stroke-width="1.5"/>
  <polygon points="246,112 254,116 246,120" fill="#111"/>
  <text x="220" y="106" text-anchor="middle" font-size="9" fill="#888">context</text>
  <text x="220" y="96" text-anchor="middle" font-size="9" fill="#888">accumulates</text>

  <!-- Projects box -->
  <rect x="256" y="82" width="160" height="68" rx="8" fill="white" stroke="#111" stroke-width="1.5"/>
  <text x="336" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Projects</text>
  <text x="336" y="124" text-anchor="middle" font-size="10" fill="#666">"I keep coming back</text>
  <text x="336" y="137" text-anchor="middle" font-size="10" fill="#666">to this topic"</text>

  <!-- Arrow 2 -->
  <line x1="416" y1="116" x2="474" y2="116" stroke="#111" stroke-width="1.5"/>
  <polygon points="472,112 480,116 472,120" fill="#111"/>
  <text x="446" y="106" text-anchor="middle" font-size="9" fill="#888">ready to</text>
  <text x="446" y="96" text-anchor="middle" font-size="9" fill="#888">make</text>

  <!-- Artifacts box -->
  <rect x="482" y="82" width="160" height="68" rx="8" fill="white" stroke="#111" stroke-width="1.5"/>
  <text x="562" y="107" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Artifacts</text>
  <text x="562" y="124" text-anchor="middle" font-size="10" fill="#666">"Show me this as a</text>
  <text x="562" y="137" text-anchor="middle" font-size="10" fill="#666">prototype or visual"</text>

  <!-- Flow description -->
  <text x="360" y="175" text-anchor="middle" font-size="11" fill="#666">vague idea  →  accumulated context  →  tangible output</text>

  <!-- Divider -->
  <line x1="30" y1="200" x2="690" y2="200" stroke="#ddd" stroke-width="1"/>
  <text x="360" y="224" text-anchor="middle" font-size="11" fill="#999">separate entry points (you already have something concrete)</text>

  <!-- === FILES ON DISK === -->
  <text x="30" y="260" font-size="11" font-weight="600" fill="#888" letter-spacing="1">STARTS WITH FILES</text>

  <rect x="30" y="274" width="200" height="62" rx="8" fill="white" stroke="#111" stroke-width="1.5"/>
  <text x="130" y="298" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Cowork</text>
  <text x="130" y="315" text-anchor="middle" font-size="10" fill="#666">receipts, notes, folders, spreadsheets</text>

  <line x1="230" y1="305" x2="380" y2="305" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="378,301 386,305 378,309" fill="#999"/>

  <rect x="390" y="274" width="200" height="62" rx="8" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="490" y="298" text-anchor="middle" font-size="12" font-weight="500" fill="#666">Transformed output</text>
  <text x="490" y="315" text-anchor="middle" font-size="10" fill="#888">reports, summaries, organized files</text>

  <!-- === CODEBASE === -->
  <text x="30" y="365" font-size="11" font-weight="600" fill="#888" letter-spacing="1">STARTS WITH CODE</text>

  <rect x="30" y="378" width="200" height="62" rx="8" fill="white" stroke="#111" stroke-width="1.5"/>
  <text x="130" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Claude Code</text>
  <text x="130" y="419" text-anchor="middle" font-size="10" fill="#666">repos, tests, build systems, git</text>

  <line x1="230" y1="409" x2="380" y2="409" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="378,405 386,409 378,413" fill="#999"/>

  <rect x="390" y="378" width="200" height="62" rx="8" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="490" y="402" text-anchor="middle" font-size="12" font-weight="500" fill="#666">Working software</text>
  <text x="490" y="419" text-anchor="middle" font-size="10" fill="#888">features, refactors, migrations</text>
</svg>